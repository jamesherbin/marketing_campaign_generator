[project]
name = "00-backend"
version = "0.1.0"
description = "Marketing campaign state and orchestration API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "firebase-admin>=6.6,<8",
    "google-adk==1.25.1",
    "google-genai==1.64.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
    "gunicorn>=23,<24",
    "asyncpg==0.31.0",
    "cloud-sql-python-connector[asyncpg]==1.22.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
