substitutions:
  _REGION: us-east4
  _AR_REPO: marketing-campaign-generator
  _IMAGE_NAME: campaign-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - 00_backend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${BUILD_ID}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
